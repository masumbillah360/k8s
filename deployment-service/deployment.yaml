apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-lab

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-lab

  template:
    metadata:
      labels:
        app: nginx-lab

    spec:
      containers:
      - name: nginx
        image: nginx:alpine

        ports:
        - name: http
          containerPort: 80

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 12
        
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
          failureThreshold: 3
        
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 3
          

